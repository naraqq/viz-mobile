name: viz_flutter
description: "monfilm - Streaming App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.2.7

  # HTTP client
  dio: ^5.8.0+1

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Video player (HLS supported natively on Android/iOS)
  video_player: ^2.9.2

  # Gesture controls
  screen_brightness: ^0.2.2+1
  flutter_volume_controller: ^1.0.7

  # Image caching
  cached_network_image: ^3.4.1

  # Skeleton loading shimmer
  shimmer: ^3.0.0

  # Animations
  flutter_animate: ^4.5.0

  # Internationalization
  intl: ^0.20.1

  # URL launcher
  url_launcher: ^6.3.1

  # Push notifications
  onesignal_flutter: ^5.2.5

  # Firebase
  firebase_core: ^3.6.0
  firebase_remote_config: ^5.1.0
  firebase_auth: ^5.3.2
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.3

flutter_native_splash:
  color: "#000000"
  image: assets/images/logo.png
  android_12:
    image: assets/images/logo.png
    icon_background_color: "#000000"
  ios: true
  android: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/logo.png"
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
